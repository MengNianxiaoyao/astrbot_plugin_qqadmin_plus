name: check

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install UV
        run: pip install uv
      - name: Run checks
        # 与本地保持一致：版本和 pyproject.toml 中的规则都以本地为准
        run: |
          uvx --from ruff==0.17.3 ruff format .
          uvx --from ruff==0.17.3 ruff check --fix .
      - name: Commit changes
        id: commit
        uses: EndBug/add-and-commit@v9.1.4
        with:
          author_name: github-actions
          author_email: github-actions[bot]@users.noreply.github.com
          message: 'ruff: check'
          add: '.'